name: Sync OneDrive Excel

on:
  schedule:
    - cron: '*/15 * * * *' # Automatically runs every 15 minutes
  workflow_dispatch:       # Allows manual trigger on GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Download Live OneDrive Excel File
        run: |
          python -c "
          import requests
          url = 'https://1drv.ms/x/c/b750e9ddb4b03ccf/IQROPBrUVbipSrm0mYI9GxLaAYEstguxy_U5EDf55zibvgw?download=1'
          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}
          r = requests.get(url, headers=headers, allow_redirects=True)
          with open('data.xlsx', 'wb') as f:
              f.write(r.content)
          print('Downloaded file size:', len(r.content), 'bytes')
          "

      - name: Commit and Push Updated File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.xlsx
          git diff --staged --quiet || (git commit -m "Auto-sync live OneDrive spreadsheet" && git push)